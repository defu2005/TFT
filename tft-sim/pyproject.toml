[project]
name = "tft-sim"
version = "0.1.0"
description = "Harness trung lap (env-agnostic) de danh gia policy 8 nguoi choi; kem toy env va adapter TFT_GOAT (chua kiem thu)."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
bc = ["torch>=2.2"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tft_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
